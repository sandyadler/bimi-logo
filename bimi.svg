<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     version="1.1"
     viewBox="0 0 1000 1000">
  <title>Adler Consulting Partners BIMI Logo</title>
  <g fill="none" fill-rule="evenodd">
    <!-- Main "A" shape -->
    <path fill="#1F2D39"
          d="M200 850 L500 150 L800 850 Z"/>
    <!-- Inner cut / negative space for the A -->
